[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcel-backend"
version = "0.1.0"
description = "FastAPI backend for the Arcel strength and conditioning RAG assistant."
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.7",
    "cohere==6.1.0",
    "fastapi==0.135.3",
    "google-cloud-storage==3.2.0",
    "langchain==1.2.15",
    "langchain-chroma",
    "langchain-community==0.4.1",
    "langchain-core==1.2.30",
    "langchain-openai",
    "langchain-tavily",
    "langchain-text-splitters==1.1.1",
    "openai==2.32.0",
    "pillow==12.2.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "PyMuPDF==1.27.2.2",
    "pytesseract==0.3.13",
    "python-dotenv==1.2.2",
    "sentry-sdk[fastapi]",
    "supabase",
    "tqdm==4.67.3",
    "uvicorn==0.44.0",
]

[tool.setuptools.packages.find]
where = ["server"]
include = ["app*"]
namespaces = true
