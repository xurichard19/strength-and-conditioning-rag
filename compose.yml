services:
  api:
    image: arcel-backend
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: arcel-api
    user: root
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      - ./secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro

  index:
    image: arcel-backend
    build:
      context: .
      dockerfile: server/Dockerfile
    user: root
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      - ./secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro
    command: python server/scripts/index_system_docs.py
