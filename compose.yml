services:
  proxy:
    image: nginx:alpine
    container_name: arcel-proxy
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    image: arcel-backend
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: arcel-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env

  api-local:
    image: arcel-backend
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: arcel-api-local
    user: root
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      - ./secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro

  index:
    image: arcel-backend
    build:
      context: .
      dockerfile: server/Dockerfile
    user: root
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      - ./secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro
    command: python server/scripts/index_system_docs.py
