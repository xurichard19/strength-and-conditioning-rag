name: tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: backend
            directory: ''
          - suite: mobile
            directory: mobile
          - suite: database
            directory: ''
          - suite: web
            directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: ${{ matrix.suite == 'backend' && 'pip' || '' }}
          cache-dependency-path: pyproject.toml
      - if: matrix.directory != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: install backend test dependencies
        if: matrix.suite == 'backend'
        run: python -m pip install ".[test]"
      - name: install frontend dependencies
        if: matrix.directory != ''
        run: npm ci --prefix "${{ matrix.directory }}"
      - name: run checks
        run: python tests/run.py "${{ matrix.suite }}"
